name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check and build
        shell: bash
        run: sh scripts/check.sh
      - name: Package native executable
        shell: bash
        run: |
          sh scripts/package.sh ci dist/package
          (cd dist/package && sha256sum --check --quiet SHA256SUMS)
          if [ "$RUNNER_OS" = Windows ]; then binary=memberid.exe; else binary=memberid; fi
          test "$(./dist/package/$binary version)" = "MemberID ci"
          if sh scripts/package.sh ci dist/package; then
            printf 'Packaging overwrote an existing destination.\n' >&2
            exit 1
          fi
          (cd dist/package && sha256sum --check --quiet SHA256SUMS)
      - name: Verify container uses the packaged executable
        if: runner.os == 'Linux'
        run: |
          docker build --tag memberid:ci dist/package
          test "$(docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges memberid:ci version)" = "MemberID ci"
          container=$(docker create memberid:ci version)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/usr/local/bin/memberid" dist/from-container
          cmp dist/package/memberid dist/from-container
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race ./...

  security:
    name: Repository security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install reviewed Gitleaks release
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Check commit metadata
        run: sh scripts/check-metadata.sh history HEAD
      - name: Scan Git history
        run: gitleaks git --redact --no-banner --no-color --log-opts="--all"

  database:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with disposable PostgreSQL
        run: sh scripts/test-integration.sh
