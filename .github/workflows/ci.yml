name: CI

on:
  push:
    branches: [main, 'release/[0-9]*.[0-9]*']
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: PR checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/pr_checks.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Install reviewed Node LTS
        if: steps.scope.outputs.code == 'true'
        run: sh scripts/ci-node.sh
      - name: Check and build on Linux
        if: steps.scope.outputs.code == 'true'
        run: sh scripts/check.sh
      - name: Test CI and release scripts
        if: steps.scope.outputs.automation == 'true'
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Test affected database behavior
        if: steps.scope.outputs.integration != ''
        env:
          MEMBERID_TEST_PATTERN: ${{ steps.scope.outputs.integration }}
        run: sh scripts/test-integration.sh

  security:
    name: Repository security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install reviewed Gitleaks release
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Check commit metadata
        run: sh scripts/check-metadata.sh history HEAD
      - name: Validate the PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -B -c 'import os, sys; sys.path.insert(0, "scripts"); from release_version import impact; impact(os.environ["PR_TITLE"])'
      - name: Scan Git history
        run: gitleaks git --redact --no-banner --no-color --log-opts="--all"

  publish:
    name: Publish SHA image
    needs: security
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.memberid-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install reviewed Node LTS
        shell: bash
        run: sh scripts/ci-node.sh
      - name: Package and smoke-test the SHA image
        run: |
          mkdir -p dist
          sh scripts/package.sh "sha-$GITHUB_SHA" dist/package
          (cd dist/package && sha256sum --check --quiet SHA256SUMS)
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          docker build --tag "$image" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=sha-$GITHUB_SHA" dist/package
          test "$(docker run --rm --network none "$image" version)" = "MemberID sha-$GITHUB_SHA"
          echo "MEMBERID_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Sign in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -m 700 -p "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the tested image
        run: |
          docker push "$MEMBERID_IMAGE"
          digest=$(docker image inspect "$MEMBERID_IMAGE" --format '{{index .RepoDigests 0}}')
          printf '{"commit":"%s","digest":"%s"}\n' "$GITHUB_SHA" "${digest##*@}" > "$RUNNER_TEMP/image.json"
          printf 'Published `%s`\n\nPinned snapshot `%s`.\n' "$MEMBERID_IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf '\nManual release source: `%s/%s`.\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - name: Record the published digest for manual release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.json
          if-no-files-found: error
      - name: Remove registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
