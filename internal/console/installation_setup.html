<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首次设置 · MemberID</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18181b;background:#fafafa;color-scheme:light}
*{box-sizing:border-box}
body{min-height:100dvh;display:grid;place-items:center;margin:0;padding:1.5rem}
main{width:min(100%,28rem);background:white;border:1px solid #e4e4e7;border-radius:1rem;padding:1.75rem}
h1{margin:0 0 1.5rem;font-size:1.5rem;line-height:1.25}
dl{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:0 0 1.25rem;padding:0 0 1rem;border-bottom:1px solid #e4e4e7}
dt{color:#52525b;font-size:.875rem;margin-bottom:.25rem}dd{margin:0;font-weight:600}
label{display:block;font-size:.875rem;font-weight:600;margin:0 0 .375rem}
input,button{font:inherit}input:not([type=checkbox]){padding:.625rem .75rem;min-width:0;width:100%;height:2.75rem;border:1px solid #a1a1aa;border-radius:.5rem}
input[readonly]{background:#fafafa;font-family:ui-monospace,monospace}
button{border:1px solid #18181b;border-radius:.5rem;min-height:2.75rem;padding:.5rem .875rem;background:#18181b;color:white;cursor:pointer}
button[type=submit]{width:100%;margin-top:.75rem;font-weight:600}
button.secondary{background:white;color:#18181b;border-color:#a1a1aa}
:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.secret{display:flex;gap:.5rem}.secret button{white-space:nowrap}
.feedback{min-height:2.5rem;margin:.5rem 0;font-size:.875rem;line-height:1.4;color:#52525b}
.error{color:#991b1b}.confirm{display:flex;align-items:center;gap:.5rem;min-height:2.25rem}
.confirm input{accent-color:#18181b;width:1.125rem;height:1.125rem;margin:0}
a{color:#3f3f46;font-size:.875rem;text-underline-offset:.2em}.alternate{display:block;margin-top:1rem;text-align:center}
</style>
{{if .Password}}<script src="/setup/copy.js" defer></script>{{end}}
</head>
<body><main>
<h1>初始化 MemberID</h1>
<dl>
<div><dt>组织 ID</dt><dd>{{.OrganizationID}}</dd></div>
<div><dt>平台管理员用户名</dt><dd>{{.Username}}</dd></div>
</dl>
{{if .Password}}
<form method="post" action="/setup">
<label for="generated-password">初始密码</label>
<div class="secret">
<input id="generated-password" value="{{.Password}}" readonly autocomplete="off" spellcheck="false" aria-describedby="save-note">
<button class="secondary" id="copy-password" type="button" hidden>复制</button>
</div>
<p id="save-note" class="feedback" role="status">密码只显示一次，请将它保存到密码管理器。</p>
<label class="confirm"><input type="checkbox" name="saved" value="yes" required>我已保存密码</label>
<input type="hidden" name="confirmation" value="{{.Confirmation}}">
<button type="submit" name="action" value="complete">完成设置并登录</button>
</form>
{{else}}
<form method="post" action="/setup">
<label for="setup-code">一次性设置码</label>
<input id="setup-code" name="code" type="password" autocomplete="off" pattern="[A-Za-z0-9_\-]{43}" maxlength="43" required aria-describedby="code-note">
<p id="code-note" class="feedback{{if .Error}} error{{end}}" role="status">{{if .Error}}{{.Error}}{{else}}请在部署终端运行 <code>memberid setup code</code>。{{end}}</p>
<button type="submit" name="action" value="generate">生成初始密码</button>
</form>
<a class="alternate" href="/auth/login">已有账号？登录</a>
{{end}}
</main></body>
</html>
