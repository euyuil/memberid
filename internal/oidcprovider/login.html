<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · MemberID</title>
<style nonce="{{.Nonce}}">
:root{font-family:system-ui,sans-serif;color:#172a34;background:#f3f6f7;color-scheme:light}
*{box-sizing:border-box}body{margin:0;padding:2rem 1rem}main{max-width:30rem;margin:auto;background:white;border:1px solid #d8e2e6;border-radius:1rem;padding:1.5rem}
h1{margin:0 0 .5rem;font-size:1.6rem}p{line-height:1.5}label{display:block;margin:.7rem 0 .3rem}input,select,button{font:inherit;min-height:2.75rem;border:1px solid #9aadb7;border-radius:.4rem;padding:.5rem .7rem;width:100%}button{background:#17566b;color:white;border-color:#17566b;cursor:pointer;margin:.6rem 0}button:disabled{background:#dce5e9;border-color:#dce5e9;color:#586b75;cursor:default}input:disabled,select:disabled{background:#f1f4f5}input[readonly]{background:#f1f4f5}.secondary{background:white;color:#17566b}.feedback{min-height:4.5rem;overflow-wrap:anywhere;color:#304d5c;font-size:.95rem;margin:.6rem 0}.consent{min-height:3.5rem;display:flex;gap:.5rem;align-items:flex-start;line-height:1.5}.consent input{width:1.1rem;min-height:1.1rem;margin:.2rem 0}small{color:#4c626d;overflow-wrap:anywhere}.section{border-top:1px solid #e1e7ea;padding-top:.6rem;margin-top:.6rem}a{color:#17566b}
</style>
</head>
<body><main>
<h1>MemberID</h1>
<p>Sign in to <strong>{{.ClientID}}</strong>.</p>
<small>Requested identity information: {{.Scopes}}</small>
<div class="feedback" role="status" aria-live="polite">{{.Message}}</div>
<form method="post" action="/login">
<input type="hidden" name="request" value="{{.Request.ID}}"><input type="hidden" name="csrf" value="{{.Request.CSRF}}">
<label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+86 mobile number" pattern="(\+86)?1[3-9][0-9]{9}" value="{{.Request.PhoneNumber}}" required {{if or .Pending .Verified}}readonly{{end}}>
<button name="action" value="send" {{if or .Pending .Verified}}disabled{{end}}>Send verification code</button>
</form>
<form method="post" action="/login">
<input type="hidden" name="request" value="{{.Request.ID}}"><input type="hidden" name="csrf" value="{{.Request.CSRF}}">
<label for="code">Verification code</label><input id="code" name="code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required {{if or (not .Pending) .Verified}}disabled{{end}}>
<button name="action" value="verify" {{if or (not .Pending) .Verified}}disabled{{end}}>Verify phone</button>
<button class="secondary" name="action" value="cancel" formnovalidate {{if and (not .Pending) (not .Verified)}}disabled{{end}}>Cancel verification</button>
</form>
<form method="post" action="/login" class="section">
<input type="hidden" name="request" value="{{.Request.ID}}"><input type="hidden" name="csrf" value="{{.Request.CSRF}}">
<label for="member">Organization identity</label><select id="member" name="member" {{if or (not .Verified) .FactorClient}}disabled{{else}}required{{end}}>
{{if .FactorClient}}<option>Verified phone identity</option>{{else}}<option value="">Select a Member</option>{{range .Members}}<option value="{{.ID}}">{{.Label}}</option>{{end}}{{end}}
</select>
<label class="consent"><input name="consent" type="checkbox" value="yes" {{if not .Verified}}disabled{{end}} {{if .ConsentRequired}}required{{else}}checked{{end}}>Allow this application to receive the requested identity information.</label>
<button name="action" value="continue" {{if not .Verified}}disabled{{end}}>Continue to application</button>
</form>
<small>Each organization has an independent Member identity.</small>
</main></body></html>
